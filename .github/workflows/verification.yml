name: Verification

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==12.3.0
      - run: npm ci
      - name: Run acceptance
        id: acceptance
        env:
          BIFROST_CI_REPORT: "1"
          BIFROST_CI_REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BIFROST_CI_REPORT_RUN_ID: ${{ github.run_id }}
          BIFROST_CI_REPORT_RUN_ATTEMPT: ${{ github.run_attempt }}
          BIFROST_CI_REPORT_REPOSITORY: ${{ github.repository }}
          BIFROST_CI_REPORT_SERVER_URL: ${{ github.server_url }}
        run: npm run acceptance
      - name: Refresh CRAP trend history
        if: always()
        env:
          CRAP_HISTORY: ${{ runner.temp }}/crap-history.jsonl
        run: |
          if [ -f docs/quality/crap-history.jsonl ]; then
            cp docs/quality/crap-history.jsonl "$CRAP_HISTORY"
          else
            : > "$CRAP_HISTORY"
          fi
          npm run test:coverage
          node scripts/crap-report.mjs --record --history "$CRAP_HISTORY"

      - name: Attach CRAP history to report data
        if: always()
        env:
          REPORT_DATA: ${{ steps.acceptance.outputs.report-data }}
          CRAP_HISTORY: ${{ runner.temp }}/crap-history.jsonl
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const reportDataPath = process.env.REPORT_DATA;
          const historyPath = process.env.CRAP_HISTORY;
          if (!reportDataPath || !historyPath || !existsSync(reportDataPath) || !existsSync(historyPath)) process.exit(0);
          let data;
          try { data = JSON.parse(readFileSync(reportDataPath, 'utf8')); } catch { process.exit(0); }
          if (!data || typeof data !== 'object' || Array.isArray(data)) process.exit(0);
          const records = [];
          for (const line of readFileSync(historyPath, 'utf8').split('\\n')) {
            const trimmed = line.trim();
            if (trimmed === '') continue;
            try { records.push(JSON.parse(trimmed)); } catch { process.exit(0); }
          }
          data.crapHistory = records;
          writeFileSync(reportDataPath, JSON.stringify(data));
          NODE

      - name: Upload CRAP trend history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crap-history-${{ github.event.pull_request.head.sha || github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crap-history.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure logs and UI screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: screenshots/
          if-no-files-found: ignore
      - name: Upload candidate-bound manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-manifest-${{ github.event.pull_request.head.sha || github.sha }}
          path: screenshots/verification/**/result.json
          if-no-files-found: ignore
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: screenshots/acceptance/**
          if-no-files-found: ignore
      - name: Upload candidate-bound Markdown report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-${{ github.event.pull_request.head.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.acceptance.outputs.report-markdown }}
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload candidate-bound publisher data
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report-${{ github.event.pull_request.head.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.acceptance.outputs.report-data }}
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve report data across checkouts
        if: always() && github.event_name == 'pull_request'
        env:
          REPORT_DATA: ${{ steps.acceptance.outputs.report-data }}
        run: |
          mkdir -p "$RUNNER_TEMP/bifrost-report-input"
          if [ -f "$REPORT_DATA" ]; then cp "$REPORT_DATA" "$RUNNER_TEMP/bifrost-report-input/report-data.json"; fi

      - name: Check out the proposed merge
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install proposed merge dependencies
        if: github.event_name == 'pull_request'
        run: npm ci
      - name: Run acceptance on the proposed merge
        id: merge-acceptance
        if: github.event_name == 'pull_request'
        run: npm run acceptance:deterministic
      - name: Upload merge-result evidence
        if: always() && github.event_name == 'pull_request' && (steps.merge-acceptance.outcome == 'success' || steps.merge-acceptance.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: merge-result-evidence-${{ github.sha }}
          path: |
            screenshots/verification/**/result.json
            screenshots/acceptance/**
          if-no-files-found: ignore

      - name: Render final candidate report
        if: always() && github.event_name == 'pull_request'
        env:
          REPORT_INPUT: ${{ runner.temp }}/bifrost-report-input/report-data.json
          REPORT_OUTPUT: ${{ runner.temp }}/bifrost-final-report/ci-report.md
          REPORT_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_RUN_ID: ${{ github.run_id }}
          REPORT_ATTEMPT: ${{ github.run_attempt }}
          REPORT_REPOSITORY: ${{ github.repository }}
          REPORT_SERVER_URL: ${{ github.server_url }}
          CRAP_HISTORY: ${{ runner.temp }}/crap-history.jsonl
          RELEASE_RESULT: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { renderCiReport } from './scripts/ci-report.mjs';
          let data = null;
          try { data = JSON.parse(readFileSync(process.env.REPORT_INPUT, 'utf8')); } catch {}
          const { markdown, confidence } = renderCiReport(data, {
            trusted: true,
            sha: process.env.REPORT_SHA,
            runId: process.env.REPORT_RUN_ID,
            attempt: process.env.REPORT_ATTEMPT,
            repository: process.env.REPORT_REPOSITORY,
            serverUrl: process.env.REPORT_SERVER_URL,
            conclusion: process.env.RELEASE_RESULT,
            crapHistoryPath: process.env.CRAP_HISTORY,
          });
          mkdirSync(dirname(process.env.REPORT_OUTPUT), { recursive: true });
          writeFileSync(process.env.REPORT_OUTPUT, markdown);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
          if (process.env.RELEASE_RESULT === 'success' && confidence.state !== 'VERIFIED CHECKS') process.exitCode = 1;
          NODE
      - name: Upload final candidate report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: final-ci-report-${{ github.event.pull_request.head.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bifrost-final-report/ci-report.md
          if-no-files-found: error
