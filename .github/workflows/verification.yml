name: Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==12.3.0
      - run: npm ci
      - name: Run acceptance
        id: acceptance
        env:
          BIFROST_CI_REPORT: "1"
          BIFROST_CI_REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BIFROST_CI_REPORT_RUN_ID: ${{ github.run_id }}
          BIFROST_CI_REPORT_RUN_ATTEMPT: ${{ github.run_attempt }}
          BIFROST_CI_REPORT_REPOSITORY: ${{ github.repository }}
          BIFROST_CI_REPORT_SERVER_URL: ${{ github.server_url }}
        run: npm run acceptance
      - name: Upload failure logs and UI screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: screenshots/
          if-no-files-found: ignore
      - name: Upload candidate-bound manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-manifest-${{ github.event.pull_request.head.sha || github.sha }}
          path: screenshots/verification/**/result.json
          if-no-files-found: ignore
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: screenshots/acceptance/**
          if-no-files-found: ignore
      - name: Upload candidate-bound Markdown report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-${{ github.event.pull_request.head.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.acceptance.outputs.report-markdown }}
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload candidate-bound publisher data
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report-${{ github.event.pull_request.head.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.acceptance.outputs.report-data }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Check out the proposed merge
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install proposed merge dependencies
        if: github.event_name == 'pull_request'
        run: npm ci
      - name: Run acceptance on the proposed merge
        if: github.event_name == 'pull_request'
        run: npm run acceptance:deterministic
      - name: Upload merge-result evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: merge-result-evidence-${{ github.sha }}
          path: |
            screenshots/verification/**/result.json
            screenshots/acceptance/**
          if-no-files-found: ignore
